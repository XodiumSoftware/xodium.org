<!doctype html>
<html data-theme="halloween" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta
            content="Xodium - Open source CAD software organization. Building innovative tools for the engineering community."
            name="description"
        />
        <meta content="Xodium" name="author" />

        <!-- Browser UI color, matching the halloween theme's base-100 -->
        <meta content="#303030" name="theme-color" />

        <!-- Canonical URL -->
        <link href="https://xodium.org" rel="canonical" />

        <!-- Open Graph -->
        <meta property="og:title" content="Xodium" />
        <meta
            property="og:description"
            content="Open source CAD software organization. Building innovative tools for the engineering community."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://xodium.org" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Xodium" />
        <meta
            name="twitter:description"
            content="Open source CAD software organization. Building innovative tools for the engineering community."
        />

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "Xodium",
                "url": "https://xodium.org",
                "logo": "https://xodium.org/favicon.svg",
                "sameAs": ["https://github.com/XodiumSoftware"],
                "description": "Open source CAD software organization. Building innovative tools for the engineering community."
            }
        </script>

        <!-- DNS Prefetch and Preconnect for team avatars -->
        <link href="https://avatars.githubusercontent.com" rel="dns-prefetch" />
        <link
            crossorigin=""
            href="https://avatars.githubusercontent.com"
            rel="preconnect"
        />

        <link
            data-trunk
            href="public/favicon.svg"
            rel="icon"
            type="image/svg+xml"
        />
        <link data-trunk href="public/favicon.svg" rel="copy-file" />
        <link data-trunk href="public/style.css" rel="tailwind-css-extra" />
        <link data-trunk href="public/_headers" rel="copy-file" />
        <title>Xodium</title>
    </head>
    <body class="bg-base-100 font-mono">
        <noscript>
            <div
                style="
                    max-width: 32rem;
                    margin: 20vh auto 0;
                    padding: 0 1.5rem;
                    text-align: center;
                    color: #d4d4d4;
                "
            >
                <h1>Xodium</h1>
                <p>
                    This site is a WebAssembly application and needs JavaScript
                    to render its content. In the meantime, you can find us on
                    <a
                        href="https://github.com/XodiumSoftware"
                        style="color: #ffa25d"
                        >GitHub</a
                    >.
                </p>
            </div>
        </noscript>
    </body>
</html>
