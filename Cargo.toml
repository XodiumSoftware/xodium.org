[package]
name = "xodiumweb"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.9.0-rc0", features = ["csr"] }
wasm-bindgen = "0.2.130"
gloo-net = { version = "0.7.0", features = ["http", "json"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-storage = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Element", "console"] }
console_error_panic_hook = "0.1.7"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
