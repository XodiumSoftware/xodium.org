[package]
name = "xodiumweb"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.9.0-beta", features = ["csr"] }
wasm-bindgen = "0.2"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "MediaQueryList", "Document", "Element", "HtmlElement", "Node", "console", "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry"] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"

serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"

[build-dependencies]
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
