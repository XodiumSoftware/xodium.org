name: Docs CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: |
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - id: setup_pages
        name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0

      - id: cache_dependencies
        name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - id: build_docs
        name: Build Rustdoc
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --target wasm32-unknown-unknown
        shell: bash

      - name: Upload Pages Artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload doc/ rather than hoisting <crate>/ to the root: rustdoc writes
          # root-path="../" into every page, which resolves against the site root
          # only when the crate sits one level down.
          path: target/wasm32-unknown-unknown/doc

  deploy:
    name: Deploy
    needs: [build]
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || github.ref_name == 'main') &&
      !contains(github.event.head_commit.message, '[ci-skip]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
